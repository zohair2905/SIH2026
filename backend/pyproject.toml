[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Legacy prototype modules stay functionally untouched in Phase 0; style
# checks below are scoped to the pre-existing import layout.
"app/api/*.py" = ["I001", "BLE001"]
"app/schemas/*.py" = ["I001"]
"app/services/*.py" = ["I001", "F401", "B019"]
"app/database/*.py" = ["I001", "B019", "UP017"]