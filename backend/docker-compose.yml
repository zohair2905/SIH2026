services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sih_postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sihdb}
      POSTGRES_USER: ${POSTGRES_USER:-sih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sih_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sih_pgdata: